[tool.ruff]
# Exclude a variety of commonly ignored directories.
exclude = [
    ".bzr",
    ".direnv",
    ".eggs",
    ".git",
    ".git-rewrite",
    ".hg",
    ".ipynb_checkpoints",
    ".mypy_cache",
    ".nox",
    ".pants.d",
    ".pyenv",
    ".pytest_cache",
    ".pytype",
    ".ruff_cache",
    ".svn",
    ".tox",
    ".venv",
    ".vscode",
    "__pypackages__",
    "_build",
    "buck-out",
    "build",
    "dist",
    "node_modules",
    "site-packages",
    "venv",
    "Homework 2/src"
]

# Same as Black.
line-length = 88
indent-width = 4

# Assume Python 3.9
target-version = "py39"

# Enforce all pydocstyle (D) rules, then ignore those that conflict with Google-style.
extend-select = ["D"]
extend-ignore = [
    "D107",  # __init__ docstring
    "D203",  # 1 blank line before class docstring
    "D212",  # Multi-line docstring summary not separated
    "D213",  # Multi-line docstring summary not separated
    "D402",  # First line should be a summary (module)
    "D413",  # Missing blank line after last section
    "D415",  # Section name should be properly capitalized
    "D416",  # Section name ending without colon
    "D417",  # Missing argument description
]

[tool.ruff.lint]
# Enable Pyflakes (F), pycodestyle (E4, E7, E9), naming (N801),
# docstrings (D100–D106), annotations (ANN101, ANN102, ANN201, ANN202).
select = [
    "E4",
    "E7",
    "E9",
    "F",
    "N801",
    "D100",
    "D101",
    "D102",
    "D103",
    "D104",
    "D105",
    "D106",
    "ANN201",
    "ANN202"
]
ignore = [
    "F405",
    "F403",
    "F401"
]
# Allow fix for all enabled rules (when `--fix`) is provided.
fixable = ["ALL"]
unfixable = []
# Allow unused variables when underscore-prefixed.
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"

[tool.ruff.format]
# Like Black, use double quotes for strings.
quote-style = "double"
# Like Black, indent with spaces, rather than tabs.
indent-style = "space"
# Like Black, respect magic trailing commas.
skip-magic-trailing-comma = false
# Like Black, automatically detect the appropriate line ending.
line-ending = "auto"
# Disable automatic reformatting of code examples in docstrings.
docstring-code-format = false
# Use dynamic line length for code snippets in docstrings.
docstring-code-line-length = "dynamic"

[tool.ruff.lint.isort]
# Enable Ruff’s built-in import sorting (Black-compatible).
from-first = true
known-first-party = ["src"]
length-sort = false